name: Ext-Boost CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test-windows-luajit:
    name: Test on Windows (LuaJIT)
    runs-on: windows-latest
    timeout-minutes: 10
    
    env:
      LUAJIT_INSTALL_DIR: ${{ github.workspace }}\.luajit_bin
      LUAJIT_SUBMODULE_PATH: vendor/luajit2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 必须递归拉取所有子模块
          submodules: 'recursive'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get LuaJIT submodule commit hash
        id: luajit-hash
        shell: pwsh
        run: |
          $submodule_hash = (git submodule status ${{ env.LUAJIT_SUBMODULE_PATH }}).Trim().Split(' ')[0]
          echo "hash=$submodule_hash" >> $env:GITHUB_OUTPUT

      - name: Cache MSVC-built LuaJIT
        id: cache-luajit
        uses: actions/cache@v4
        with:
          path: ${{ env.LUAJIT_INSTALL_DIR }}
          key: luajit-build-${{ runner.os }}-${{ steps.luajit-hash.outputs.hash }}

      - name: Build LuaJIT (if not cached)
        if: steps.cache-luajit.outputs.cache-hit != 'true'
        working-directory: ${{ env.LUAJIT_SUBMODULE_PATH }}/src
        shell: pwsh
        run: |
          Write-Host "Building LuaJIT..."
          # 开启 5.2 兼容模式
          $env:CL = "/DLUAJIT_ENABLE_LUA52COMPAT"
          .\msvcbuild.bat
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $install_dir = "${{ env.LUAJIT_INSTALL_DIR }}"
          New-Item -ItemType Directory -Path $install_dir -Force
          $lua_lib_dir = Join-Path $install_dir "lua"
          New-Item -ItemType Directory -Path $lua_lib_dir -Force

          Copy-Item -Path "luajit.exe", "lua51.dll", "lua51.lib" -Destination $install_dir
          Copy-Item -Path "luajit.exe" -Destination "$install_dir\lua.exe"
          Copy-Item -Path "jit" -Destination $lua_lib_dir -Recurse

      - name: Add LuaJIT to PATH
        shell: pwsh
        run: |
          echo "${{ env.LUAJIT_INSTALL_DIR }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # === 关键步骤：构建符合 Lua 引用规则的目录结构 ===
      - name: Prepare Test Environment
        shell: pwsh
        run: |
          $test_deps = ".test_deps"
          if (Test-Path $test_deps) { Remove-Item $test_deps -Recurse -Force }
          New-Item -ItemType Directory -Path $test_deps -Force

          # 1. 安装 LuaUnit -> .test_deps/luaunit.lua
          Write-Host "Installing LuaUnit..."
          if (Test-Path "vendor/luaunit/luaunit.lua") {
              Copy-Item "vendor/luaunit/luaunit.lua" -Destination $test_deps
          } else {
              Write-Error "LuaUnit not found. Did submodules update?"
              exit 1
          }

          # 2. 安装 Lua-Ext -> .test_deps/ext/
          # 这样 require 'ext.ext' 就会寻找 .test_deps/ext/ext.lua -> 成功
          Write-Host "Installing Lua-Ext..."
          $ext_dest = Join-Path $test_deps "ext"
          New-Item -ItemType Directory -Path $ext_dest -Force
          if (Test-Path "vendor/lua-ext") {
              Copy-Item "vendor/lua-ext/*" -Destination $ext_dest -Recurse -Force
          } else {
              Write-Error "Lua-Ext not found."
              exit 1
          }

          # 3. 安装 Ext-Boost -> .test_deps/ext-boost/
          # 这样 require 'ext-boost' 就会寻找 .test_deps/ext-boost/init.lua -> 成功
          Write-Host "Installing Ext-Boost..."
          $target = Join-Path $test_deps "ext-boost"
          if (Test-Path "ext-boost") {
             # 仓库结构: root/ext-boost/init.lua
             Copy-Item "ext-boost" -Destination $test_deps -Recurse -Force
          } else {
             # 仓库结构: root/init.lua (扁平)
             Write-Host "Assuming flat structure, copying files..."
             New-Item -ItemType Directory -Path $target -Force
             Copy-Item "*.lua" -Destination $target
             # 避免复制测试脚本本身
             Remove-Item "$target/test_*.lua" -ErrorAction SilentlyContinue
          }
          
          # 调试：打印树状结构
          Write-Host "--- Final Dependency Layout ---"
          Get-ChildItem $test_deps -Recurse | Select-Object FullName

      - name: Run Tests
        shell: pwsh
        run: |
          # 转换路径为 Lua 友好的正斜杠格式
          $root = $PWD -replace "\\", "/"
          
          # 设置 LUA_PATH:
          # 1. $root/.test_deps/?.lua         -> 匹配 luaunit
          # 2. $root/.test_deps/?/init.lua    -> 匹配 ext-boost
          # 3. $root/.test_deps/ext/?.lua     -> 匹配 ext 内部引用 (如 ext.table)
          # 实际上只需要前两个模式，因为 ext 已经被放在了 .test_deps/ext 文件夹里
          
          $env:LUA_PATH = "$root/.test_deps/?.lua;$root/.test_deps/?/init.lua;;"
          
          Write-Host "LUA_PATH: $env:LUA_PATH"
          
          luajit tests/test_ext_boost.lua -v